# Prometheus runs on the CinemataCMS host. Keep this endpoint unavailable to
# public clients, including clients that reach nginx through Cloudflare.
location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/sites-enabled/uwsgi_params;
    uwsgi_pass 127.0.0.1:9000;
}

# Keep the permanent diagnostic endpoint reachable only from commands running
# on this host. The Django view adds staging, token, and rate-limit checks.
location = /internal/observability/error-probe {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    limit_except POST {
        deny all;
    }

    include /etc/nginx/sites-enabled/uwsgi_params;
    uwsgi_pass 127.0.0.1:9000;
}
